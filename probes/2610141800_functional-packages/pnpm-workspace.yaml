# 独立 pnpm 工作区：截断向上查找，不进仓根工作区；install 只写本目录的 lock 与 node_modules
packages:
  - site
  - packages/*

# 只修 Windows 上 import.meta.glob 相对 base 的缺陷（正本在仓根 patches/），与本实验的问题无关。
# 不打 @react-router/dev 补丁：本实验要验证的就是不打它也能接功能包
patchedDependencies:
  vite@8.3.4: patches/vite@8.3.4.patch

allowBuilds:
  esbuild: true
  '@parcel/watcher': false
onlyBuiltDependencies:
  - esbuild
