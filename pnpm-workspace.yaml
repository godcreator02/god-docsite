# 仓根是不发布的 private 包：平台包与功能包在 packages/，两个 gwb 插件在 plugins/，全仓文档站在 docs-site/，测试协作仓在 full-test/site/，
# 演示协作仓在 demo/site/（本地验收站，不进仓；克隆下来的仓里没有这个目录，pnpm 跳过它）

packages:
  - packages/*
  - plugins/*
  - docs-site
  - full-test/site
  - demo/site

# 外部依赖的版本只写在这里，各 package.json 的 dependencies / devDependencies 写 catalog:；
# peerDependencies 是对使用方的兼容范围，不是本仓装哪一版，照旧写字面范围。
catalog:
  '@cordisjs/plugin-timer': ^1.1.3
  '@fumadocs/base-ui': 16.17.1
  '@godcreator/gwb-commands': ^0.6.1
  '@godcreator/gwb-data': ^0.1.12
  '@godcreator/gwb-gitea': ^0.1.17
  '@godcreator/gwb-kernel-desktop': ^0.10.1
  '@godcreator/gwb-qq-bot': ^0.7.1
  '@godcreator/gwb-settings': ^0.4.0
  '@godcreator/gwb-shell': ^0.15.11
  '@godcreator/gwb-skills': ^0.4.12
  '@godcreator/gwb-unit-folder': ^0.7.22
  '@mdx-js/mdx': 3.1.1
  '@noble/hashes': ^2.4.0
  '@react-router/dev': ^8.4.0
  '@react-router/node': ^8.4.0
  '@react-router/serve': ^8.4.0
  '@standard-schema/spec': ^1.1.0
  '@tailwindcss/cli': ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@testing-library/react': ^16.3.3
  '@types/diff-match-patch': 1.0.36
  '@types/mdast': ^4.0.4
  '@types/mdx': ^2.0.14
  '@types/node': ^26.6.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/three': ^0.186.0
  '@types/unist': ^3.0.3
  class-variance-authority: ^0.7.1
  cn: ^0.2.5
  cordis: 4.0.0-rc.10
  dependency-cruiser: ^18.6.0
  diff: ^9.0.0
  diff-match-patch: 1.0.5
  esbuild: ^0.28.2
  fumadocs-core: 16.17.1
  fumadocs-mdx: 15.4.7
  isbot: ^5.2.2
  jsdom: ^30.1.2
  katex: ^0.16.47
  lucide-react: 1.54.0
  mdast-util-math: ^3.0.0
  mdast-util-mdx: ^3.0.0
  mdast-util-mdx-jsx: ^3.2.0
  mdast-util-to-markdown: ^2.1.2
  oxlint: 1.76.0
  oxlint-tsgolint: 7.0.2001
  playwright: 1.62.0
  react: ^19.3.0
  react-dom: ^19.3.0
  react-markdown: ^10.1.0
  react-router: ^8.4.0
  rehype-katex: ^7.0.1
  remark-frontmatter: ^5.0.0
  remark-gfm: ^4.0.1
  remark-math: ^6.0.0
  remark-mdx: ^3.1.0
  remark-parse: ^11.0.0
  remark-stringify: ^11.0.0
  sharp: ^0.35.5
  tailwindcss: ^4.3.3
  three: ^0.186.0
  tsdown: ^0.22.14
  typescript: ^6.0.3
  unified: ^11.0.5
  unist-util-visit: ^5.0.0
  vite: ^8.3.0
  vitefu: ^1.1.3
  vitest: ^5.0.1
  yaml: ^2.9.1
  zod: ^4.6.5

catalogs:
  # gwb 插件跑在工作台里：Node 是工作台带的那一版（类型按 24），浏览器侧的 react / react-dom
  # 由 @godcreator/gwb-shell 的 browserImports() 提供、不打包进插件，开发期装的要和它一致
  gwb-host:
    '@types/node': ^24.0.0
    '@types/react': 19.2.18
    '@types/react-dom': 19.2.5
    react: 19.2.8
    react-dom: 19.2.8

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  node-pty: false
  # 用预编译好的平台包（@img/sharp-*），不在安装时从源码编译
  sharp: false
onlyBuiltDependencies:
  - esbuild

# 功能包把 react、fumadocs 等声明成 peer，用的是使用方站点装的那份：这里别自动装一份进来
autoInstallPeers: false

