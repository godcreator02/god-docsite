packages:
  - packages/*
  - docs-site

# fumadocs-mdx 编译 source.config 用 esbuild，它要跑安装脚本才装得下平台二进制
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
onlyBuiltDependencies:
  - esbuild

# format-fumadocs 把 fumadocs 声明成 peer，用的是消费方项目装的那份：这里别自动装一份进来
autoInstallPeers: false

# 这份文件**整份盖掉**用户级 pnpm 配置（不合并），所以全局那条 @godcreator/* 的放行得在这儿再写一遍——
# 少了它 pnpm 装 packages/gwb-docfirst-workflow 的 gwb 依赖时会被 minimumReleaseAge（默认一天）全拦下
minimumReleaseAgeExclude:
  - '@godcreator/*'
  - lucide-react@1.43.0
