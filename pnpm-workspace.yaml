# 仓根是不发布的 private 包：基础包在 packages/，gwb 插件在 plugins/，自述站在 site/

packages:
  - packages/*
  - plugins/*
  - site

# vite 8.3.4 补丁：Windows 上 import.meta.glob 相对 base 的热更新失效（运行中新增文件
# 不进 glob 集合），成因与验证见 probes/2610121018_vite-add-discovery，上游修掉即撤
patchedDependencies:
  vite@8.3.4: patches/vite@8.3.4.patch

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
onlyBuiltDependencies:
  - esbuild
