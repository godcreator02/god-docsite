<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>greet 用法（手写 html）</title>
<style>
  body { font: 15px/1.7 system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #222; }
  figure.code { margin: 18px 0; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
  figure.code figcaption { padding: 6px 12px; font-size: 12px; color: #666; background: #f6f6f6; border-bottom: 1px solid #eee; }
  pre { margin: 0; padding: 12px; overflow: auto; font: 13px/1.5 Consolas, monospace; }
</style>
</head>
<body>
  <h1>greet 用法</h1>
  <p>这一页是手写的 html，没有构建管线。人看它，AI 也直接读它，没有「渲染成 md」这一步。</p>

  <figure class="code">
    <figcaption>src/greet.ts 的签名</figcaption>
    <pre data-file="src/greet.ts" data-lines="2-3"><code class="language-ts">export function greet(name: string): string {
  return `hello ${name}`;</code></pre>
  </figure>

  <p>签名约定：收一个名字，还一句问候。</p>
  <p>上面那块代码是 <code>livedoc confirm</code> 投影进来的：带 <code>data-file</code> 的元素既是记号又是展示区，容器（figure、figcaption、pre 本身）是作者的，元素里面的内容归格式包，每次确认整个重写。新引用不用记这个写法：写一行 <code>@@livedoc ref 文件:起-止 @@</code>，确认时会换成这种元素。</p>
</body>
</html>
